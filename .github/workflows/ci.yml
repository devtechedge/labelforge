name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: labelforge
          POSTGRES_PASSWORD: labelforge
          POSTGRES_DB: labelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labelforge -d labelforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://labelforge:labelforge@localhost:5432/labelforge_test?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      DEMO_DEPLOYMENT: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: labelforge
          POSTGRES_PASSWORD: labelforge
          POSTGRES_DB: labelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labelforge -d labelforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://labelforge:labelforge@localhost:5432/labelforge_test?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      DEMO_DEPLOYMENT: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
